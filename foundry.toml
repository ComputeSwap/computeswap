[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [
    { access = "read-write", path = "./reports" },
    { access = "read-write", path = "./frontend" },
    { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 512
seed = "0x2a"

[profile.deep.fuzz]
runs = 20000

[lint]
lint_on_build = false
